<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/seed-cute-v1-32.png"><meta name="theme-color" content="#10252a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="%BASE_URL%manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/seed-cute-v1-180.png"><title>SEED · 잠든 정원</title><style>html,body{margin:0;min-height:100%;background:#071418;color:#e9f0e7}html:not(.seed-loaded) body{overflow:hidden}html:not(.seed-loaded) body>*{visibility:hidden}html:not(.seed-loaded) body:before{content:"♧\A SEED";visibility:visible;white-space:pre;position:fixed;inset:0;display:grid;place-content:center;text-align:center;color:#dceac8;font:26px/2 Georgia,serif;letter-spacing:.42em;background:radial-gradient(circle,#16302b,#071418 58%);text-shadow:0 0 24px #8ee9b966}html:not(.seed-loaded) body>#seed-boot-status{visibility:visible;position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle,#16302b,#071418 70%)}html:not(.seed-loaded) body>#seed-boot-status[hidden]{display:none}#seed-boot-status section{max-width:360px;text-align:center;font:16px/1.7 system-ui,sans-serif}#seed-boot-status h2{font-size:22px}#seed-boot-status p{color:#c4d4c8}#seed-boot-status button{min-height:48px;padding:12px 24px;border:1px solid #b2cca1;border-radius:12px;background:#244332;color:#f2f6e9;font:inherit;cursor:pointer}#seed-boot-status button:focus-visible{outline:3px solid #e5d08e;outline-offset:4px}</style><script id="seed-boot-watchdog">
(() => {
 const root=document.documentElement;
 const finish=()=>{
  if(!root.classList.contains('seed-loaded'))return;
  clearTimeout(timer);observer.disconnect();document.getElementById('seed-boot-status')?.remove();root.classList.remove('seed-boot-delayed');
 };
 const show=()=>{
  if(root.classList.contains('seed-loaded')){finish();return;}
  const panel=document.getElementById('seed-boot-status');
  if(!panel){document.addEventListener('DOMContentLoaded',show,{once:true});return;}
  panel.hidden=false;root.classList.add('seed-boot-delayed');
  panel.querySelector('button').addEventListener('click',()=>location.reload(),{once:true});
 };
 const observer=new MutationObserver(finish);
 const timer=setTimeout(show,15000);
 observer.observe(root,{attributes:true,attributeFilter:['class']});finish();
})();
</script></head><body><canvas id="game"></canvas><div id="brand"><span class="sprout">♧</span><h1>SEED</h1><p>잠 든 정 원</p></div><div id="stages"><span>♧</span><i></i><span>♧</span><i></i><span>♧</span></div><button id="pause" title="일시 정지">Ⅱ</button><div id="encounter"></div><div id="status"><div class="healthrow"><b>♧</b><div class="health"><div id="hpbar"></div></div><span id="hptext">100 / 100</span></div><div class="dashrow"><span id="dashname">◇ &nbsp; 회피</span><div class="cooldown"><div id="dashbar"></div></div><div id="dash-pips" class="dash-pips" hidden aria-hidden="true"></div><span id="dashtext">준비</span></div></div><div id="rules"><div data-rule="reflect"><em>◈</em><span>튕김</span></div><div data-rule="split"><em>✣</em><span>분열</span></div><div data-rule="chain"><em>ϟ</em><span>연쇄</span></div></div><div id="help">WASD 이동 &nbsp; · &nbsp; 자동 공격 &nbsp; · &nbsp; SPACE 회피 &nbsp; · &nbsp; F 궁극기</div><div id="overlay" hidden></div><div id="toast"></div><div id="form-label"></div><div id="evolution" hidden><small>새로운 모습으로 깨어나는 중</small><strong id="evolution-title"></strong><span id="evolution-hint"></span><i></i></div><div id="seed-boot-status" hidden><section aria-labelledby="seed-boot-title"><p aria-hidden="true">♧ SEED</p><h2 id="seed-boot-title">정원을 준비하고 있어요</h2><p role="status">연결이 평소보다 오래 걸리고 있어요.<br>조금 더 기다리거나 다시 불러와 주세요.</p><button type="button">다시 불러오기</button><p><small>저장된 기록은 지우지 않습니다.</small></p></section></div><script type="module" src="/src/main.js"></script></body></html>
